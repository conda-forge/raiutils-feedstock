schema_version: 1

context:
  name: raiutils
  version: "0.4.3"

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/${{ name[0] }}/${{ name }}/raiutils-${{ version }}.tar.gz
  sha256: 92356a1ddb3af62be0ae361133ef2ee67a9a0b27d8199d056c6dcb65a564ad11

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv

requirements:
  host:
    - pip
    - python ${{ python_min }}.*
    - setuptools
  run:
    - numpy
    - pandas
    - python >=${{ python_min }}
    - requests
    - scikit-learn
    - scipy

tests:
  - python:
      imports:
        - raiutils
      python_version: ${{ python_min }}.*
  - requirements:
      run:
        - pip
        - python ${{ python_min }}.*
    script:
      - pip check

about:
  summary: Common basic utilities used across various RAI tools
  license: MIT
  license_file: LICENSE
  homepage: https://github.com/microsoft/responsible-ai-widgets

extra:
  recipe-maintainers:
    - janjagusch
    - bgalvao
